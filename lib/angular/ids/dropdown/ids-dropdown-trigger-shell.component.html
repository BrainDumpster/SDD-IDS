<div
  class="field"
  [attr.data-size]="size === 'small' ? 'small' : null"
  [attr.data-disabled]="disabled || null"
  [attr.data-error]="error || null"
  [attr.data-hover]="hover || null"
  [attr.data-focus]="focusVisible || null"
  [attr.data-filled]="filled || null"
>
  <div class="main">
    @if (showBadge && showSelectedTooltip) {
      <!-- The tooltip trigger wraps the badge only, so the IDS Tooltip's arrow
           (which centres on its trigger) points up from the badge — not the
           value text. The value text is a sibling in the same field row. -->
      <span class="triggerContent">
        <ids-tooltip side="top" arrowAlign="start" [hugContent]="true">
          <ids-tooltip-trigger>
            <span class="badgeTrigger">
              <ids-badge [value]="selectedCount" [type]="badgeType" />
            </span>
          </ids-tooltip-trigger>
          <ids-tooltip-panel>
            <ids-tooltip-header>
              <ids-tooltip-title>{{ selectedCount }} Items</ids-tooltip-title>
            </ids-tooltip-header>
            <ids-tooltip-body>
              <ul class="selectedList">
                @for (label of selectedLabels; track $index) {
                  <li>{{ label }}</li>
                }
              </ul>
            </ids-tooltip-body>
            <ids-tooltip-arrow />
          </ids-tooltip-panel>
        </ids-tooltip>
        <ng-content />
      </span>
    } @else {
      <span class="triggerContent">
        @if (showBadge) {
          <span class="badgeTrigger">
            <ids-badge [value]="selectedCount" [type]="badgeType" />
          </span>
        }
        <ng-content />
      </span>
    }
  </div>
  <span class="caret-wrap" aria-hidden="true">
    <ids-icon shapeName="arrow-drop-tri-caret" [size]="10" />
  </span>
</div>
