<nav
  #root
  class="root"
  [ngClass]="rootClass"
  aria-label="Pagination"
  data-ids="ids-pagination"
  [attr.data-background]="background"
  [attr.data-responsive-mode]="resolvedResponsiveMode"
>
  @if (renderResultsGroup) {
    <div class="resultsGroup" data-ids="ids-pagination-results">
      <span class="label">Show:</span>
      <div class="dropdownWrap">
        <button
          #perPageTrigger
          class="dropdownTrigger"
          type="button"
          [disabled]="disabled"
          aria-haspopup="listbox"
          [attr.aria-expanded]="resolvedPerPageDropdownState !== 'collapsed'"
          aria-label="Items per page"
          (click)="togglePerPageMenu()"
        >
          <span>{{ safePageSize }}</span>
          <ids-icon
            [shape]="caretIconShape"
            [size]="caretIconSize"
            variant="mask"
            [color]="caretIconColor"
          />
        </button>
      </div>
      <span class="label">per page</span>
    </div>
  }

  <div class="pageNavGroup" data-ids="ids-pagination-nav">
    @if (isSinglePage) {
      <span class="countText">{{ countText }}</span>
    } @else {
      <button
        class="iconButton"
        [class.iconButtonCollapsed]="firstLastCollapsed"
        type="button"
        [disabled]="disabled || atFirstPage"
        aria-label="First page"
        (click)="onFirstPage()"
      >
        <ids-icon
          [shape]="firstPageIconShape"
          [size]="navIconSize"
          variant="mask"
        />
      </button>
      <button
        class="iconButton"
        type="button"
        [disabled]="disabled || atFirstPage"
        aria-label="Previous page"
        (click)="onPreviousPage()"
      >
        <ids-icon
          [shape]="previousPageIconShape"
          [size]="navIconSize"
          variant="mask"
        />
      </button>
      <div class="pageInputWrap" [class.pageInputWrapCollapsed]="pageInputCollapsed">
        <input
          class="pageInput"
          [value]="pageInputValue"
          [disabled]="disabled"
          inputmode="numeric"
          aria-label="Current page"
          (input)="onPageInputChange($any($event.target).value)"
          (blur)="commitPageInput()"
          (keydown)="onPageInputKeydown($event)"
        />
      </div>
      <span class="countText">{{ countText }}</span>
      <button
        class="iconButton"
        type="button"
        [disabled]="disabled || atLastPage"
        aria-label="Next page"
        (click)="onNextPage()"
      >
        <ids-icon
          [shape]="nextPageIconShape"
          [size]="navIconSize"
          variant="mask"
        />
      </button>
      <button
        class="iconButton"
        [class.iconButtonCollapsed]="firstLastCollapsed"
        type="button"
        [disabled]="disabled || atLastPage"
        aria-label="Last page"
        (click)="onLastPage()"
      >
        <ids-icon
          [shape]="lastPageIconShape"
          [size]="navIconSize"
          variant="mask"
        />
      </button>
    }
  </div>
</nav>

@if (resolvedPerPageDropdownState !== "collapsed") {
  <ul
    #perPageMenu
    class="dropdownMenu dropdownMenuPortaled"
    [class.dropdownMenuAbove]="resolvedPerPageDropdownState === 'expanded-above'"
    [class.dropdownMenuBelow]="resolvedPerPageDropdownState === 'expanded-below'"
    data-ids-pagination-per-page-menu
    [attr.data-placement]="menuPlacement"
    [style.position]="'fixed'"
    [style.top.px]="perPageMenuPos?.top ?? 0"
    [style.left.px]="perPageMenuPos?.left ?? 0"
    [style.width.px]="perPageMenuPos?.width ?? 90"
    role="listbox"
    aria-label="Items per page options"
    (click)="$event.stopPropagation()"
  >
    @for (option of safePageSizeOptions; track option) {
      <li class="dropdownOptionWrap">
        <button
          type="button"
          role="option"
          class="dropdownOption"
          [class.dropdownOptionSelected]="option === safePageSize"
          [attr.aria-selected]="option === safePageSize"
          (click)="selectPageSize(option)"
        >
          {{ option }}
        </button>
      </li>
    }
  </ul>
}
