<span
  class="ids-tag"
  [ngClass]="[resolvedSize, typeClass, toneClass, type === 'clickable' && isSelected ? 'selected' : '']"
  [attr.data-disabled]="disabled ? true : null"
  [attr.data-focus]="focusVisible ? true : null"
  [attr.data-error]="error ? true : null"
  [attr.data-hover]="demoHover ? true : null"
  [attr.role]="type === 'clickable' ? 'button' : null"
  [attr.aria-pressed]="type === 'clickable' ? isSelected : null"
  [attr.tabindex]="isClickable ? 0 : null"
  (click)="onRootClick()"
>
  @if (type === "read-only" && leadingIconSlug) {
    <ids-icon [shapeName]="leadingIconSlug" [size]="10" className="leading-icon" />
  }

  @if (hasBadge) {
    <span class="badge">{{ badgeValue }}</span>
  }

  @if (type === "editable") {
    <span
      class="text-field"
      [attr.data-focus-on-text]="focusOnText ? true : null"
    >
      <span class="content">
        @if (showLabel) {
          <span class="prefix">
            <span class="prefix-text">{{ prefixText }}</span>
            <span class="prefix-colon">:</span>
          </span>
        }
        <span
          #editableField
          class="label"
          [attr.contenteditable]="isEditableFocusable ? true : null"
          [attr.tabindex]="isEditableFocusable ? 0 : null"
          role="textbox"
          [attr.aria-label]="label"
        >{{ label }}</span>
      </span>
    </span>
  } @else {
    <span class="content">
      @if (showLabel) {
        <span class="prefix">
          <span class="prefix-text">{{ prefixText }}</span>
          <span class="prefix-colon">:</span>
        </span>
      }
      <span class="label">{{ label }}</span>
    </span>
  }

  @if (type === "badge" && hasBadge) {
    <ids-icon shapeName="arrow-drop-tri-caret" [size]="10" className="menu-caret" />
  }

      @if (type === "editable") {
    <button
      type="button"
      class="dismiss"
      [disabled]="disabled"
      [attr.aria-label]="'Remove ' + label"
      (click)="onDismissClick($event)"
    >
      <ids-icon shapeName="shape-x-thick" [size]="10" className="dismiss-icon" />
    </button>
  }
</span>
