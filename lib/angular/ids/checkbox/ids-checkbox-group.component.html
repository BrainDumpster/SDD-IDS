<div
  class="IdsCheckboxGroup"
  data-ids="IdsCheckboxGroup"
  [attr.data-orientation]="orientation"
  [attr.data-label-position]="labelPosition"
  [attr.data-error]="error ? 'true' : null"
  [attr.data-has-error-message]="hasErrorMessage ? 'true' : null"
  [attr.data-disabled]="disabled ? 'true' : null"
  role="group"
  [attr.aria-labelledby]="shouldRenderLabel ? labelId : null"
  [attr.aria-label]="!shouldRenderLabel ? ariaLabel : null"
  [attr.aria-invalid]="error ? true : null"
  [attr.aria-errormessage]="hasErrorMessage ? errorId : null"
  [attr.aria-required]="required ? true : null"
>
  @if (shouldRenderLabel) {
    <ids-form-label
      [id]="labelId"
      [label]="label ?? ''"
      size="lg"
      [required]="required"
      [showInfoIcon]="showInfoIcon"
      className="IdsCheckboxGroupLabel"
    />
  }
  <div class="IdsCheckboxGroupBody" data-ids="IdsCheckboxGroupBody">
    <div class="IdsCheckboxGroupItems" data-ids="IdsCheckboxGroupItems">
      <ng-content />
    </div>
    @if (hasErrorMessage) {
      <ids-error [id]="errorId">
        <ids-error-text [text]="errorText" />
      </ids-error>
    }
  </div>
</div>
