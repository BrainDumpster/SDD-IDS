<button
  #triggerButton
  type="button"
  class="ids-dropdown-button__trigger"
  [attr.data-style]="dropdown.buttonStyle"
  [attr.data-size]="dropdown.size"
  [attr.data-open]="dropdown.isOpen ? 'true' : null"
  [attr.data-disabled]="dropdown.disabled ? 'true' : null"
  [disabled]="dropdown.disabled"
  aria-haspopup="menu"
  [attr.aria-expanded]="dropdown.isOpen"
  [attr.aria-controls]="dropdown.menuId"
  [attr.aria-label]="ariaLabel ? accessibleName : null"
  (click)="onClick()"
  (keydown)="onKeydown($event)"
>
  <span class="ids-dropdown-button__trigger-content">
    @if (showLeadingIcon) {
      <ids-icon
        className="ids-dropdown-button__trigger-leading-icon"
        [shapeName]="leadingIconName"
        variant="mask"
        [size]="16"
      />
    }

    <span class="ids-dropdown-button__trigger-label">{{ label }}</span>

    <ids-icon
      className="ids-dropdown-button__trigger-caret"
      [shapeName]="caretIconName"
      variant="mask"
      [size]="10"
    />
  </span>
</button>
