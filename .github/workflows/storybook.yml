name: Build and Publish Storybook Preview Environments

on:
  push:
    branches:
      - master
      - main
  pull_request:
    types: [opened, synchronize]

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          # Tells GitHub Actions where to find package-lock.json for caching
          cache-dependency-path: './storybook/package-lock.json'

      - name: Install Dependencies
        # Runs the installation inside the subfolder
        working-directory: ./storybook
        run: npm ci

      - name: Build Storybook
        # Runs the build script inside the subfolder
        working-directory: ./storybook
        run: npm run build

        # Set routing paths based on whether it is a PR or Main branch push
      - name: Set Deployment Destination
        id: paths
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "target_dir=preview/pr-${{ github.event.number }}" >> $GITHUB_OUTPUT
            echo "is_pr=true" >> $GITHUB_OUTPUT
          else
            echo "target_dir=." >> $GITHUB_OUTPUT
            echo "is_pr=false" >> $GITHUB_OUTPUT
          fi

      # Deploys files cleanly without destroying existing subdirectories
      - name: Deploy to GitHub Pages Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          # Points to the build output directory inside your subfolder
          folder: storybook/storybook-static
          branch: gh-pages
          target-folder: ${{ steps.paths.outputs.target_dir }}
          clean: ${{ steps.paths.outputs.is_pr == 'false' }}

      # Leave a helpful link directly in your Pull Request
      - name: Comment PR Link
        if: github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@v3
        with:
          message: |
            🚀 Storybook Preview is ready!
            🔗 [View Staging Storybook](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/preview/pr-${{ github.event.number }}/index.html)
