name: Build and Publish Storybook Preview Environments

on:
  push:
    branches:
      - master
      - main
  pull_request:
    types: [opened, synchronize]

# Core permissions required for official Pages deployment and PR commenting
permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './storybook/package-lock.json'

      - name: Install dependencies
        working-directory: ./storybook
        run: npm ci

      - name: Build Storybook
        working-directory: ./storybook
        run: npm run build-storybook

      # Pre-arranges directory structure for deployment: 
      # Puts PR builds inside a /pr-XX folder, and main branch builds straight in the root.
      - name: Organize Deployment Workspace
        run: |
          mkdir -p public_site
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            mkdir -p public_site/pr-${{ github.event.number }}
            cp -r storybook/storybook-static/* public_site/pr-${{ github.event.number }}/
          else
            cp -r storybook/storybook-static/* public_site/
          fi

      # Official GitHub action to turn your organized directory into a Pages deployment artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public_site'
          
  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      # Official GitHub action to publish the artifact created in the build job
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
      - name: Comment PR Link via GitHub CLI
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          COMMENT_BODY="🚀 Storybook Preview is ready!
          🔗 [Click here to view preview](https://${OWNER}.github.io/${REPO_NAME}/pr-${PR_NUMBER}/)"
          
          # Check if we already left a preview comment to avoid spamming the PR timeline
          EXISTING_COMMENT_ID=$(gh api repos/${REPO}/issues/${PR_NUMBER}/comments \
            --jq '.[] | select(.body | contains("Storybook Preview is ready!")) | .id' | head -n 1)
          
          if [ -z "$EXISTING_COMMENT_ID" ]; then
            # Create a brand new comment
            gh pr comment $PR_NUMBER --body "$COMMENT_BODY"
          else
            # Edit the existing comment with the updated code deployment
            gh api -X PATCH repos/${REPO}/issues/comments/$EXISTING_COMMENT_ID -f body="$COMMENT_BODY"
          fi 
