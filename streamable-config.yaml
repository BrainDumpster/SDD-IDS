# Streamable Configuration for RAG Component Generator
apiVersion: v1
kind: Service
metadata:
  name: rag-component-generator
  labels:
    app: rag-component-generator
    service: streamable
spec:
  type: LoadBalancer
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: rag-component-generator

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-component-generator
  labels:
    app: rag-component-generator
spec:
  replicas: 3
  selector:
    matchLabels:
      app: rag-component-generator
  template:
    metadata:
      labels:
        app: rag-component-generator
    spec:
      containers:
      - name: rag-component-generator
        image: rag-component-generator:latest
        ports:
        - containerPort: 8080
          protocol: TCP
        env:
        - name: PYTHONPATH
          value: "/app"
        - name: MCP_SERVER_NAME
          value: "rag-component-generator-streamable"
        - name: LOG_LEVEL
          value: "INFO"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: ServiceMonitor
metadata:
  name: rag-component-generator
  labels:
    app: rag-component-generator
spec:
  selector:
    matchLabels:
      app: rag-component-generator
  endpoints:
  - port: http
    path: /metrics
    interval: 30s

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rag-component-generator-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - rag-generator.example.com
    secretName: rag-generator-tls
  rules:
  - host: rag-generator.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: rag-component-generator
            port:
              number: 8080
