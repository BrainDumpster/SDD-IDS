# Server deploy — no git clone, no build.
# Prerequisites on the server:
#   1. Docker + Compose
#   2. Image already loaded (docker load) or pullable from a registry
#   3. This file + .env (+ empty ./data)
#
#   export COLLAB_IMAGE=design-spec-collab:latest   # or ghcr.io/org/design-spec-collab:1.0
#   docker compose -f docker-compose.deploy.yml up -d

services:
  collab:
    image: ${COLLAB_IMAGE:-design-spec-collab:latest}
    pull_policy: ${COLLAB_PULL_POLICY:-never}
    ports:
      - "${COLLAB_HOST_PORT:-8091}:8091"
    env_file:
      - .env
    environment:
      REPO_ROOT: /workspace
      DESIGN_SYSTEMS_DIR: /workspace/config/design_systems
      JOBS_DIR: /app/data/jobs
      SESSIONS_DIR: /app/data/sessions
      COLLAB_SESSIONS_DIR: /app/data/collab_sessions
      AUDIT_LOG_PATH: /app/data/audit/audit.jsonl
      AUTH_MODE: ${AUTH_MODE:-disabled}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env}
      FIGMA_MODE: ${FIGMA_MODE:-rest}
      FIGMA_TOKEN: ${FIGMA_TOKEN:-}
      FIGMA_MCP_URL: ${FIGMA_MCP_URL:-https://api.figma.com/mcp}
      FIGMA_SSL_VERIFY: ${FIGMA_SSL_VERIFY:-true}
      SERVER_REVIEW_MODE: ${SERVER_REVIEW_MODE:-rules}
      STUB_FORCE_REVISE_ONCE: ${STUB_FORCE_REVISE_ONCE:-false}
      SESSION_REQUIRE_CLAIM: ${SESSION_REQUIRE_CLAIM:-true}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-24}
      COLLAB_MAX_TURNS: ${COLLAB_MAX_TURNS:-3}
      AUTO_CREATE_PR: ${AUTO_CREATE_PR:-true}
      GITHUB_PUBLISH_DRY_RUN: ${GITHUB_PUBLISH_DRY_RUN:-false}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO_URL: ${GITHUB_REPO_URL:-}
      GITHUB_OWNER: ${GITHUB_OWNER:-}
      GITHUB_REPO: ${GITHUB_REPO:-}
      GITHUB_STARTING_REF: ${GITHUB_STARTING_REF:-master}
      CATALOGUE_SOURCE: ${CATALOGUE_SOURCE:-local}
      # Baked Spec Accurate Design preview (must exist in the image)
      STORYBOOK_STATIC_DIR: /app/storybook-static
      STORYBOOK_REBUILD_ENABLED: ${STORYBOOK_REBUILD_ENABLED:-true}
      REQUESTS_CA_BUNDLE: ${REQUESTS_CA_BUNDLE:-}
      SSL_CERT_FILE: ${SSL_CERT_FILE:-}
      CURL_CA_BUNDLE: ${CURL_CA_BUNDLE:-}
    volumes:
      - ./data:/app/data
      - ${COLLAB_CERTS_DIR:-./certs}:/certs:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
