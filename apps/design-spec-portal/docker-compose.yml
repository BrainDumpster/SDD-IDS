# Phase 1–3: portal API + static UI (agent on Cursor Cloud or dry-run)
services:
  portal:
    build:
      context: .
      dockerfile: Dockerfile
    image: design-spec-portal:local
    ports:
      - "${PORTAL_HOST_PORT:-8090}:8090"
    env_file:
      - .env
    environment:
      # Paths inside the container (override anything in .env for Docker layout)
      REPO_ROOT: /workspace
      DESIGN_SYSTEMS_DIR: /workspace/config/design_systems
      JOBS_DIR: /app/data/jobs
      SESSIONS_DIR: /app/data/sessions
      AUDIT_LOG_PATH: /app/data/audit/audit.jsonl
      # Defaults if not set in .env
      CLOUD_AGENT_DRY_RUN: ${CLOUD_AGENT_DRY_RUN:-true}
      CLOUD_AGENT_AUTO_START: ${CLOUD_AGENT_AUTO_START:-true}
      AUTH_MODE: ${AUTH_MODE:-disabled}
      CURSOR_API_KEY: ${CURSOR_API_KEY:-}
      FIGMA_TOKEN: ${FIGMA_TOKEN:-}
      CLOUD_REPO_URL: ${CLOUD_REPO_URL:-}
      ALLOWED_CLOUD_REPO_URLS: ${ALLOWED_CLOUD_REPO_URLS:-}
      CLOUD_STARTING_REF: ${CLOUD_STARTING_REF:-main}
      CURSOR_MODEL: ${CURSOR_MODEL:-composer-2.5}
      FIGMA_MCP_URL: ${FIGMA_MCP_URL:-https://api.figma.com/mcp}
      CLOUD_AUTO_CREATE_PR: ${CLOUD_AUTO_CREATE_PR:-false}
    volumes:
      # Monorepo (programmes + skills for prompt paths)
      - ../..:/workspace:ro
      # Writable job / session / audit data
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
