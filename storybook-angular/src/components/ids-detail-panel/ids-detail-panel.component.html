@if (expanded) {
  @if (showDatagridHeader) {
    <header class="ids-detail-panel__header">
      <h3 class="ids-detail-panel__title">
        <ng-content select="ids-detail-panel-header" />
        @if (!hasHeaderSlot) {
          {{ title }}
        }
      </h3>
      <div class="ids-detail-panel__controls">
        <button
          type="button"
          class="ids-detail-panel__toggle"
          [attr.aria-label]="toggleAriaLabel"
          [attr.aria-expanded]="expanded"
          [attr.aria-controls]="bodyId"
          (click)="onToggleClick()"
          (keydown)="onToggleKeydown($event)"
        >
          <ids-icon [shapeName]="toggleIcon" [size]="16" className="ids-detail-panel__toggle-icon" />
        </button>
      </div>
    </header>
  }

  <div [id]="bodyId" class="ids-detail-panel__body">
    <ng-content select="ids-detail-panel-body" />
    @if (!hasBodySlot) {
      <ng-content />
    }
  </div>

  @if (showPageFooter) {
    <footer class="ids-detail-panel__footer">
      <div class="ids-detail-panel__controls">
        <button
          type="button"
          class="ids-detail-panel__toggle"
          [attr.aria-label]="toggleAriaLabel"
          [attr.aria-expanded]="expanded"
          [attr.aria-controls]="bodyId"
          (click)="onToggleClick()"
          (keydown)="onToggleKeydown($event)"
        >
          <ids-icon [shapeName]="toggleIcon" [size]="16" className="ids-detail-panel__toggle-icon" />
        </button>
      </div>
    </footer>
  }
} @else {
  <div
    class="ids-detail-panel__collapsed-rail"
    [class.ids-detail-panel__collapsed-rail--page]="attachMode === 'page'"
    [class.ids-detail-panel__collapsed-rail--datagrid]="attachMode === 'datagrid'"
  >
    <div class="ids-detail-panel__controls">
      <button
        type="button"
        class="ids-detail-panel__toggle"
        [attr.aria-label]="toggleAriaLabel"
        [attr.aria-expanded]="expanded"
        (click)="onToggleClick()"
        (keydown)="onToggleKeydown($event)"
      >
        <ids-icon [shapeName]="toggleIcon" [size]="16" className="ids-detail-panel__toggle-icon" />
      </button>
    </div>
  </div>
}
