<div [class.ids-main-menu-left__item-block]="isPrimary && !groupId">
  <div
    [ngClass]="rowClasses"
    [attr.title]="tooltip || null"
    [attr.aria-current]="
      isPrimary
        ? root.primaryAriaCurrent(itemId, groupId, forceState)
        : isSecondary && root.isSecondarySelected(itemId, groupId ?? '')
          ? 'page'
          : null
    "
    [attr.aria-expanded]="isPrimary && groupId ? root.primaryAriaExpanded(groupId) : null"
    (click)="onActivate($event)"
  >
    <div class="ids-main-menu-left__link-host">
      <ng-content />
    </div>
    @if (showChevron) {
      <ids-icon
        className="ids-main-menu-left__chevron-icon"
        [shapeName]="chevronShape"
        variant="mask"
        [size]="14"
      />
    }
    @if (isPrimary && root.isPrimaryFocused(itemId, forceState)) {
      <span class="ids-main-menu-left__focus-ring" aria-hidden="true"></span>
    }
    @if (isPrimary && root.showPrimaryInset(itemId, groupId, forceState)) {
      <span class="ids-main-menu-left__selected-inset" aria-hidden="true"></span>
    }
  </div>
</div>
